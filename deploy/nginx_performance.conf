# Installed in nginx's http context by deploy/vps_deploy.sh.
# Hashed Vite assets are safe to cache for a year; media filenames are
# versioned by Django or invalidated through the API URL version parameter.
map $uri $shivarpan_expires {
    default off;
    ~^/assets/ 1y;
    ~^/static/ 30d;
    ~^/media/ 30d;
}

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_static on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.api+json
    application/xml
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

expires $shivarpan_expires;
